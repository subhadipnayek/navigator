<mat-toolbar class="terminal-navbar">
  <a class="brand" mat-button routerLink="/">
    <span class="brand-badge">NAV</span>
    <span class="brand-title">NAVIGATOR</span>
    <span class="brand-sub">TERMINAL</span>
  </a>

  <div class="status-live-pill" title="Live AMFI NAV synchronization active">
    <span class="pulse-dot"></span>
    <span>AMFI LIVE</span>
  </div>

  <span class="toolbar-spacer"></span>

  <nav aria-label="Primary navigation">
    @if (auth.isAuthenticated()) {
      <a mat-button routerLink="/dashboard" routerLinkActive="active">
        <span class="nav-icon">dashboard</span>
        <span>Dashboard</span>
      </a>
      <a mat-button routerLink="/research" routerLinkActive="active">
        <span class="nav-icon">query_stats</span>
        <span>Research</span>
      </a>
      <a mat-button routerLink="/portfolio" routerLinkActive="active">
        <span class="nav-icon">pie_chart</span>
        <span>Portfolio</span>
      </a>
      @if (auth.isAdmin()) {
        <a mat-button routerLink="/admin" routerLinkActive="active">
          <span class="nav-icon">tune</span>
          <span>Admin</span>
        </a>
      }
    }
  </nav>

  <div class="auth-group">
    @if (auth.user(); as user) {
      <div class="user-badge" title="Authenticated session">
        <span class="user-name">{{ user.username }}</span>
        <span class="user-role">{{ user.role }}</span>
      </div>
      <button mat-stroked-button class="logout-btn" type="button" (click)="logout()">Sign Out</button>
    } @else {
      <a mat-button routerLink="/login" routerLinkActive="active">Sign In</a>
      <a mat-flat-button class="register-btn" routerLink="/register" routerLinkActive="active">Get Started</a>
    }
  </div>
</mat-toolbar>

<main>
  <router-outlet />
</main>
