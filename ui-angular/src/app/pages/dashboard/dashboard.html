<div class="dashboard">
  <h1>NAVigator</h1>
  <p class="subtitle">Mutual Fund & ETF Comparison Tool</p>

  <div class="stats">
    @if (loading()) {
      <app-stat-card label="Funds in Database">
        <app-skeleton width="80px" height="2rem" />
      </app-stat-card>
    } @else if (fundCount() !== null) {
      <app-stat-card label="Funds in Database">
        {{ fundCount()!.toLocaleString() }}
      </app-stat-card>
    }
  </div>

  <nav class="quick-links">
    <a routerLink="/funds" class="link-card">
      <h3>Search Funds</h3>
      <p>Browse and search mutual funds & ETFs</p>
    </a>
    <a routerLink="/compare" class="link-card">
      <h3>Compare Funds</h3>
      <p>Side-by-side returns comparison</p>
    </a>
    <a routerLink="/admin/sync" class="link-card">
      <h3>Sync Data</h3>
      <p>Update fund master list from AMFI</p>
    </a>
  </nav>
</div>
