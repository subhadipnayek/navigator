<mat-toolbar>
  <a class="brand" mat-button routerLink="/">
    <span class="brand-mark">N</span>
    <span>NAVigator</span>
  </a>
  <span class="toolbar-spacer"></span>
  <nav aria-label="Primary navigation">
    @if (auth.isAuthenticated()) {
      <a mat-button routerLink="/dashboard" routerLinkActive="active">Dashboard</a>
      <a mat-button routerLink="/funds" routerLinkActive="active">Funds</a>
      <a mat-button routerLink="/compare" routerLinkActive="active">Compare</a>
      <a mat-button routerLink="/portfolio-lab" routerLinkActive="active">Portfolio Lab</a>
      @if (auth.isAdmin()) {
        <a mat-button routerLink="/admin" routerLinkActive="active">Admin</a>
      }
    }
  </nav>

  @if (auth.user(); as user) {
    <button class="user-pill" mat-button type="button" disabled>{{ user.username }} · {{ user.role }}</button>
    <button mat-button type="button" (click)="logout()">Logout</button>
  } @else {
    <a mat-button routerLink="/login" routerLinkActive="active">Login</a>
    <a mat-flat-button routerLink="/register" routerLinkActive="active">Register</a>
  }
</mat-toolbar>

<main>
  <router-outlet />
</main>
