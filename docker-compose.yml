services:
  db:
    image: postgres:17-alpine
    container_name: navigator-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: NAVigatorDb_QA
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: devpassword
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devuser -d NAVigatorDb_QA"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./navigator-api
      dockerfile: Dockerfile
    container_name: navigator-api
    restart: unless-stopped
    ports:
      - "5038:8080"
    environment:
      PORT: "8080"
      GIN_MODE: "release"
      DATABASE_URL: "host=db port=5432 user=devuser password=devpassword dbname=NAVigatorDb_QA sslmode=disable"
      JWT_KEY: "dev-only-change-this-secret-key-before-production-use"
      JWT_ISSUER: "NAVigator"
      JWT_AUDIENCE: "NAVigator"
      JWT_EXPIRES_HOURS: "8"
      CORS_ORIGINS: "http://localhost:4000,http://localhost:4200,http://localhost:5038,http://localhost:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  ui:
    build:
      context: ./navigator-ui
      dockerfile: Dockerfile
    container_name: navigator-ui
    restart: unless-stopped
    ports:
      - "4000:4000"
    depends_on:
      api:
        condition: service_started

volumes:
  postgres_data:
