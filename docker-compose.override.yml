    image: mcr.microsoft.com/dotnet/sdk:10.0
    # ... other settings (volumes, working_dir) ...
    networks:
      - global_sql_network # Connect to the DB network
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      # Use the container_name 'sqlserver' instead of an IP!
